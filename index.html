<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fleet & Fuel Logistics Manager</title>
    <meta name="description" content="A comprehensive system for tracking fuel deliveries, fleet transactions, customer ledgers, station reports, and payments across multiple locations." />
    
    <!-- PWA Headers -->
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FuelFleet" />
    <!-- Google Fonts Preload for Crisp Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <script>
      const originalError = console.error;
      console.error = (...args) => {
        const str = args.map(a => (typeof a === 'object' ? (a?.message || a?.stack || '') : String(a))).join(' ');
        if (str.includes('WebSocket') || str.includes('vite') || str.includes('closed without opened')) return;
        originalError.call(console, ...args);
      };
      const originalWarn = console.warn;
      console.warn = (...args) => {
        const str = args.map(a => String(a)).join(' ');
        if (str.includes('width(-1) and height(-1)') || str.includes('WebSocket')) return;
        originalWarn.call(console, ...args);
      };
      window.addEventListener('unhandledrejection', (event) => {
        const msg = event?.reason?.message || String(event?.reason || '');
        if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', (event) => {
        const msg = event?.message || event?.error?.message || '';
        if (msg.includes('WebSocket') || msg.includes('closed without opened')) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
